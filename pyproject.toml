[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "attention-tracker"
version = "1.0.0"
description = "Attention-aware video controller — pause media when you look away."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.14",
    "numpy>=1.26.0",
    "PySide6>=6.7.0",
    "pyautogui>=0.9.54",
    "pywin32>=306",
    "winsdk>=1.0.0b10",
]

[project.scripts]
attention-tracker = "app:main"

[project.urls]
Homepage = "https://shyammohanvis.github.io/attention-tracker/"
Documentation = "https://shyammohanvis.github.io/attention-tracker/"
Repository = "https://github.com/ShyamMohanvis/attention-tracker"
Issues = "https://github.com/ShyamMohanvis/attention-tracker/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pyinstaller>=6.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Windows"
